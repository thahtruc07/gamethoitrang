<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Game Thời Trang — Tất cả tính năng</title>
<style>
  :root{
    --bg:#0f1724; --panel:#0b1220; --accent:#ff6b81; --muted:#9aa4b2; --glass:rgba(255,255,255,0.04);
    --card-bg: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:Inter,Segoe UI,Roboto,Arial; background:linear-gradient(180deg,#071225,#02111b); color:#ecf2fb;
    min-height:100vh; padding:20px; display:flex; gap:16px; justify-content:center;
  }
  .wrap{width:1200px; max-width:100%; display:grid; grid-template-columns:360px 1fr 360px; gap:16px;}

  header{grid-column:1/-1; display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
  header h1{margin:0; font-size:20px}
  .top-controls{display:flex; gap:8px; align-items:center}

  .panel{background:var(--card-bg); border-radius:12px; padding:12px; border:1px solid var(--glass)}
  .panel h2{margin:0 0 8px 0; font-size:16px}

  /* Left: Kho đồ (draggables) */
  .wardrobe{display:flex; flex-direction:column; gap:8px; max-height:74vh; overflow:auto; padding-right:6px}
  .group{background:rgba(255,255,255,0.02); border-radius:8px; padding:8px}
  .items{display:flex; gap:8px; flex-wrap:wrap}
  .item{
    width:86px; height:96px; border-radius:10px; background:linear-gradient(180deg,#0b1b2a,#061222);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px; cursor:grab;
    border:1px solid rgba(255,255,255,0.03); transition:transform .15s; user-select:none;
  }
  .item:active{cursor:grabbing}
  .item img{width:48px;height:48px; margin-bottom:6px}
  .item .name{font-size:12px; color:var(--muted); text-align:center}

  /* Center: Preview */
  .preview-wrap{display:flex; flex-direction:column; gap:12px; align-items:center}
  .preview-card{width:520px; height:640px; border-radius:14px; background:linear-gradient(180deg,#06111b,#021018); display:flex;flex-direction:column;align-items:center;padding:18px; position:relative; border:1px solid rgba(255,255,255,0.03)}
  .character-area{width:360px; height:520px; background:linear-gradient(180deg,#0c2330,#04202a); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; position:relative; overflow:hidden}
  .char-face{width:160px;height:160px;border-radius:50%; background:linear-gradient(180deg,#ffdca8,#ffc58f); display:flex;align-items:center;justify-content:center; font-size:84px; margin-top:24px; box-shadow:0 6px 18px rgba(0,0,0,0.4)}
  /* slots */
  .slots{position:absolute; bottom:16px; display:flex; gap:12px; align-items:flex-end}
  .slot{width:100px;height:96px;border-radius:10px;background:rgba(255,255,255,0.02); border:1px dashed rgba(255,255,255,0.03); display:flex;flex-direction:column; align-items:center; justify-content:center; padding:6px; transition:transform .15s}
  .slot.drag-over{transform:scale(1.04); border-color:var(--accent)}
  .slot .label{font-size:11px;color:var(--muted); margin-bottom:6px}
  .slot img{width:56px;height:56px;object-fit:contain}

  /* Right: Controls & history */
  .controls-col{display:flex; flex-direction:column; gap:12px}
  .btn{background:linear-gradient(90deg,var(--accent),#ff8fb3); border:none; padding:10px 12px; border-radius:10px; cursor:pointer; color:#061018; font-weight:600}
  .btn.ghost{background:transparent; border:1px solid rgba(255,255,255,0.06); color:var(--muted)}
  .small{padding:8px 10px; font-size:14px}
  .meta{font-size:13px;color:var(--muted);}

  .history{max-height:48vh; overflow:auto; padding:8px; border-radius:8px; background:rgba(255,255,255,0.01)}
  .history-item{display:flex;justify-content:space-between; padding:8px; border-bottom:1px solid rgba(255,255,255,0.02)}
  .theme-badge{padding:6px 8px;border-radius:999px;background:rgba(255,255,255,0.03); font-size:13px}

  /* animations */
  .fade-in{animation:fadeIn .35s ease both}
  @keyframes fadeIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

  /* responsive */
  @media (max-width:1100px){ .wrap{grid-template-columns:1fr; padding-bottom:40px} .preview-card{width:100%;height:auto}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎮 Game Thời Trang — Tất cả tính năng</h1>
      <div class="top-controls">
        <div class="meta">Hướng dẫn: kéo món đồ vào khung tương ứng → nhấn <b>Đánh giá</b></div>
      </div>
    </header>

    <!-- LEFT: Wardrobe -->
    <aside class="panel">
      <h2>🧰 Kho đồ</h2>
      <div class="wardrobe" id="wardrobe">
        <!-- groups injected by JS -->
      </div>
    </aside>

    <!-- CENTER: Preview -->
    <main class="panel preview-wrap">
      <div style="display:flex; gap:12px; width:100%; justify-content:space-between; align-items:center">
        <div style="display:flex; gap:8px; align-items:center">
          <label style="font-size:13px; color:var(--muted)">Nhân vật</label>
          <select id="characterSelect">
            <!-- options injected -->
          </select>
        </div>

        <div style="display:flex; gap:8px; align-items:center">
          <div class="theme-badge" id="themeBadge">Theme: —</div>
          <button class="btn small" id="newThemeBtn">Random Theme</button>
        </div>
      </div>

      <div class="preview-card fade-in" id="previewCard">
        <div class="character-area" id="characterArea">
          <div class="char-face" id="charFace">🙂</div>

          <!-- Slots: will be absolute positioned at bottom -->
          <div class="slots" id="slotsContainer">
            <!-- slot elements injected -->
          </div>
        </div>

        <div style="display:flex; gap:10px; margin-top:12px; width:100%; justify-content:center">
          <button class="btn" id="evaluateBtn">Đánh giá</button>
          <button class="btn ghost small" id="resetBtn">Reset</button>
          <button class="btn ghost small" id="exportBtn">Tải outfit (JSON)</button>
        </div>

        <div style="margin-top:10px; width:100%; display:flex; justify-content:space-between; align-items:center">
          <div class="meta">Điểm vòng này: <b id="scoreLabel">—</b></div>
          <div class="meta">Lượt: <b id="roundLabel">0</b></div>
        </div>
      </div>
    </main>

    <!-- RIGHT: Controls & history -->
    <aside class="panel controls-col">
      <div>
        <h2>⭐ Lịch sử & Điểm</h2>
        <div class="history" id="history"></div>
      </div>

      <div>
        <h2>⚙️ Tùy chọn</h2>
        <div style="display:flex; gap:8px; margin-bottom:8px">
          <button class="btn ghost small" id="shuffleItems">Làm mới kho</button>
          <button class="btn ghost small" id="randomOutfit">Random Outfit</button>
        </div>
        <div style="margin-top:8px">
          <label class="meta">Gợi ý: nhấn <b>Random Theme</b> để thay chủ đề, rồi test outfit.</label>
        </div>
      </div>
    </aside>
  </div>

<script>
/* ========== Dữ liệu ========== */
const THEMES = [
  { id:1, name: 'Summer Chic', hints:['light','floral','casual'] },
  { id:2, name: 'Streetwear', hints:['bold','sneakers','layers'] },
  { id:3, name: 'Vintage Glam', hints:['classic','dressy','retro'] },
  { id:4, name: 'Goth Punk', hints:['dark','edge','metal'] },
  { id:5, name: 'Boho Festival', hints:['earthy','patterns','accessories'] }
];

const CHARACTERS = [
  { id:'c1', name:'Luna', emoji:'👩‍🎤', color:'#ffdca8' },
  { id:'c2', name:'Maya', emoji:'👩', color:'#f6d6ff' },
  { id:'c3', name:'Kai', emoji:'🧑‍🦱', color:'#c8f7ff' }
];

/* Mỗi item có: id,type,name,img(svg string or emoji),tags[] */
let ALL_ITEMS = [
  { id:'top1', type:'Top', name:'Áo hồng', img:'<svg viewBox="0 0 64 64" width="48" height="48"><rect x="8" y="12" width="48" height="36" rx="6" fill="#ffb6d5"/></svg>', tags:['light','floral','casual'] },
  { id:'top2', type:'Top', name:'Áo thun trắng', img:'<svg viewBox="0 0 64 64" width="48" height="48"><rect x="8" y="12" width="48" height="36" rx="6" fill="#ffffff"/></svg>', tags:['light','casual']},
  { id:'top3', type:'Top', name:'Áo khoác da', img:'<svg viewBox="0 0 64 64" width="48" height="48"><rect x="8" y="12" width="48" height="36" rx="6" fill="#111111"/></svg>', tags:['dark','edge']},
  { id:'bot1', type:'Bottom', name:'Quần jean', img:'<svg viewBox="0 0 64 64" width="48" height="48"><rect x="14" y="30" width="36" height="24" rx="6" fill="#3b82f6"/></svg>', tags:['casual','bold']},
  { id:'bot2', type:'Bottom', name:'Chân váy xếp ly', img:'<svg viewBox="0 0 64 64" width="48" height="48"><rect x="12" y="28" width="40" height="26" rx="6" fill="#ff9fc3"/></svg>', tags:['dressy','retro']},
  { id:'bot3', type:'Bottom', name:'Quần họa tiết', img:'<svg viewBox="0 0 64 64" width="48" height="48"><rect x="12" y="28" width="40" height="26" rx="6" fill="#a78bfa"/></svg>', tags:['patterns','earthy']},
  { id:'shoe1', type:'Shoes', name:'Sneakers', img:'<svg viewBox="0 0 64 64" width="48" height="48"><rect x="8" y="42" width="48" height="12" rx="6" fill="#10b981"/></svg>', tags:['sneakers','casual','bold']},
  { id:'shoe2', type:'Shoes', name:'Giày cao gót', img:'<svg viewBox="0 0 64 64" width="48" height="48"><rect x="16" y="36" width="32" height="16" rx="6" fill="#ff6b81"/></svg>', tags:['dressy','classic']},
  { id:'shoe3', type:'Shoes', name:'Bốt combat', img:'<svg viewBox="0 0 64 64" width="48" height="48"><rect x="10" y="34" width="44" height="20" rx="6" fill="#111827"/></svg>', tags:['edge','dark']},
  { id:'acc1', type:'Accessory', name:'Kính mát', img:'<svg viewBox="0 0 64 64" width="48" height="48"><circle cx="22" cy="28" r="8" fill="#0ea5a4"/><circle cx="42" cy="28" r="8" fill="#0ea5a4"/></svg>', tags:['casual','bold']},
  { id:'acc2', type:'Accessory', name:'Túi xách', img:'<svg viewBox="0 0 64 64" width="48" height="48"><rect x="14" y="20" width="36" height="28" rx="6" fill="#f97316"/></svg>', tags:['dressy','accessories']},
  { id:'acc3', type:'Accessory', name:'Vòng cổ ngọc', img:'<svg viewBox="0 0 64 64" width="48" height="48"><circle cx="32" cy="30" r="12" fill="#fef3c7"/></svg>', tags:['classic','dressy']},
  { id:'hair1', type:'Hairstyle', name:'Tóc dài xoăn', img:'<svg viewBox="0 0 64 64" width="48" height="48"><circle cx="32" cy="24" r="14" fill="#fca5a5"/></svg>', tags:['boho','floral']},
  { id:'hair2', type:'Hairstyle', name:'Tóc ngắn bob', img:'<svg viewBox="0 0 64 64" width="48" height="48"><circle cx="32" cy="24" r="14" fill="#f3e8ff"/></svg>', tags:['vintage','classic']},
  { id:'hair3', type:'Hairstyle', name:'Tóc spiky', img:'<svg viewBox="0 0 64 64" width="48" height="48"><circle cx="32" cy="24" r="14" fill="#c7f2ff"/></svg>', tags:['punk','edge']}
];

/* ========== State ========== */
let state = {
  items: [...ALL_ITEMS],
  equipped: { Top: null, Bottom: null, Shoes: null, Accessory: null, Hairstyle: null },
  theme: null,
  round: 0,
  history: [],
  currentCharacter: CHARACTERS[0].id
};

/* ========== Helper DOM refs ========== */
const wardrobeEl = document.getElementById('wardrobe');
const slotsContainer = document.getElementById('slotsContainer');
const charFace = document.getElementById('charFace');
const characterSelect = document.getElementById('characterSelect');
const themeBadge = document.getElementById('themeBadge');
const scoreLabel = document.getElementById('scoreLabel');
const roundLabel = document.getElementById('roundLabel');
const historyEl = document.getElementById('history');

/* ========== Init UI ========== */
function init(){
  renderWardrobe();
  renderCharacters();
  renderSlots();
  setTheme(randomChoice(THEMES));
  bindButtons();
  renderHistory();
}
function bindButtons(){
  document.getElementById('newThemeBtn').onclick = ()=> setTheme(randomChoice(THEMES));
  document.getElementById('evaluateBtn').onclick = evaluateOutfit;
  document.getElementById('resetBtn').onclick = resetOutfit;
  document.getElementById('shuffleItems').onclick = ()=>{ shuffle(state.items); renderWardrobe(); }
  document.getElementById('randomOutfit').onclick = randomizeOutfit;
  document.getElementById('exportBtn').onclick = exportOutfitJSON;
  characterSelect.onchange = (e)=> { state.currentCharacter = e.target.value; renderCharacterFace(); }
}
function renderCharacters(){
  characterSelect.innerHTML = CHARACTERS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  characterSelect.value = state.currentCharacter;
  renderCharacterFace();
}
function renderCharacterFace(){
  const ch = CHARACTERS.find(c=>c.id===state.currentCharacter) || CHARACTERS[0];
  charFace.innerText = ch.emoji;
  charFace.style.background = `linear-gradient(180deg, ${ch.color}, ${lighten(ch.color, -0.06)})`;
}

/* ========== Wardrobe ========== */
function renderWardrobe(){
  const groups = groupBy(state.items, 'type'); // types: Top, Bottom, Shoes, Accessory, Hairstyle
  wardrobeEl.innerHTML = Object.keys(groups).map(t=>{
    return `<div class="group">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-weight:600">${t}</div>
        <div style="font-size:12px;color:var(--muted)">${groups[t].length} items</div>
      </div>
      <div class="items">${groups[t].map(itemToHTML).join('')}</div>
    </div>`;
  }).join('');
  // Attach drag listeners
  document.querySelectorAll('.item').forEach(el=>{
    el.addEventListener('dragstart', onDragStart);
    el.addEventListener('click', onItemClick); // tap to equip fallback
  });
}
function itemToHTML(it){
  // wrap SVG string inside a draggable element; store data-id
  return `<div class="item" draggable="true" data-id="${it.id}" title="${it.name}">
    <div style="width:48px;height:48px">${it.img}</div>
    <div class="name">${it.name}</div>
  </div>`;
}
function onItemClick(e){
  // if user taps / clicks item, equip to matching slot automatically if empty
  const id = e.currentTarget.dataset.id;
  const item = state.items.find(x=>x.id===id);
  if(!item) return;
  const slotType = item.type;
  if(state.equipped[slotType] && confirm('Slot đã có đồ, bạn muốn thay không?')) {
    state.equipped[slotType] = item.id;
  } else {
    state.equipped[slotType] = item.id;
  }
  renderSlots();
}

/* ========== Slots ========== */
function renderSlots(){
  const order = ['Top','Bottom','Shoes','Accessory','Hairstyle'];
  slotsContainer.innerHTML = order.map(t=>{
    const eq = state.equipped[t];
    const item = eq ? state.items.find(i=>i.id===eq) : null;
    return `<div class="slot" data-slot="${t}">
      <div class="label">${t}</div>
      ${item ? `<div class="img-wrap">${item.img}</div>` : `<div style="font-size:12px;color:var(--muted)">Kéo đồ vào</div>`}
    </div>`;
  }).join('');
  // Attach drop handlers
  document.querySelectorAll('.slot').forEach(s=>{
    s.addEventListener('dragover', onDragOver);
    s.addEventListener('drop', onDrop);
    s.addEventListener('dragleave', onDragLeave);
  });
}

/* Drag & Drop handlers */
let dragData = null;
function onDragStart(e){
  const id = e.currentTarget.dataset.id;
  dragData = state.items.find(x=>x.id===id);
  e.dataTransfer.setData('text/plain', id);
  // small ghost
  const crt = document.createElement('div');
  crt.style.padding='6px 8px';
  crt.style.background='rgba(255,255,255,0.06)';
  crt.style.color='white';
  crt.style.borderRadius='6px';
  crt.innerText = dragData.name;
  document.body.appendChild(crt);
  e.dataTransfer.setDragImage(crt, 20, 10);
  setTimeout(()=>document.body.removeChild(crt),0);
}
function onDragOver(e){
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function onDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}
function onDrop(e){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const slotType = e.currentTarget.dataset.slot;
  const id = e.dataTransfer.getData('text/plain') || (dragData && dragData.id);
  const item = state.items.find(i=>i.id===id);
  if(!item) return;
  if(item.type !== slotType){
    alert('Món này không hợp với slot này — kéo vào slot đúng loại (ví dụ Top vào Top).');
    return;
  }
  state.equipped[slotType] = id;
  renderSlots();
}

/* ========== Evaluate / Scoring ========== */
function evaluateOutfit(){
  // scoring: +2 điểm cho mỗi tag match với theme.hints; small bonus if >1 match; penalty if empty slots
  const theme = state.theme;
  if(!theme){ alert('Chọn theme trước (Random Theme).'); return; }
  state.round += 1;
  const equippedIds = Object.values(state.equipped);
  let score = 0;
  let breakdown = [];
  for(const slot of Object.keys(state.equipped)){
    const id = state.equipped[slot];
    if(!id){ breakdown.push(`${slot}: -1 (chưa chọn)`); score -= 1; continue; }
    const item = state.items.find(i=>i.id===id);
    const matches = item.tags.filter(t=> theme.hints.includes(t)).length;
    score += matches * 2;
    breakdown.push(`${slot}: ${matches} tag phù hợp`);
  }
  // bonus if 4+ matches total
  const totalMatches = Object.keys(state.equipped).reduce((acc, slot)=>{
    const id = state.equipped[slot];
    if(!id) return acc;
    const item = state.items.find(i=>i.id===id);
    return acc + item.tags.filter(t=> state.theme.hints.includes(t)).length;
  },0);
  if(totalMatches >= 4){ score += 3; breakdown.push('Bonus outfit hài hòa +3'); }

  // clamp
  if(score < 0) score = 0;
  scoreLabel.innerText = score;
  roundLabel.innerText = state.round;

  // push to history
  const entry = {
    round: state.round,
    theme: state.theme.name,
    score,
    outfit: {...state.equipped},
    timestamp: new Date().toISOString()
  };
  state.history.unshift(entry);
  renderHistory();

  // visual feedback: flash theme badge
  themeBadge.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:360, easing:'ease'});
  // quick toast-like breakdown
  showToast(`Điểm: ${score} — ${breakdown.join(' • ')}`, 4200);
}

/* ========== History ========== */
function renderHistory(){
  historyEl.innerHTML = state.history.length ? state.history.map(h=>{
    return `<div class="history-item">
      <div>
        <div style="font-weight:600">${h.theme}</div>
        <div style="font-size:12px;color:var(--muted)">${new Date(h.timestamp).toLocaleString()}</div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:700">${h.score} pts</div>
        <div style="font-size:12px;color:var(--muted)">Lượt ${h.round}</div>
      </div>
    </div>`;
  }).join('') : `<div style="padding:12px;color:var(--muted)">Chưa có lịch sử. Đánh giá outfit để lưu lịch sử.</div>`;
}

/* ========== Utilities: theme, randomize, reset, export ========== */
function setTheme(theme){
  state.theme = theme;
  themeBadge.innerText = `Theme: ${theme.name}`;
  // show hints tooltip
  showToast(`Theme: ${theme.name} — gợi ý: ${theme.hints.join(', ')}`, 3000);
}
function randomizeOutfit(){
  // fill each slot with random matching item or totally random
  const types = ['Top','Bottom','Shoes','Accessory','Hairstyle'];
  for(const t of types){
    const pool = state.items.filter(i=>i.type===t);
    state.equipped[t] = randomChoice(pool).id;
  }
  renderSlots();
}
function resetOutfit(){
  state.equipped = { Top: null, Bottom: null, Shoes: null, Accessory: null, Hairstyle: null };
  scoreLabel.innerText = '—';
  renderSlots();
}
function exportOutfitJSON(){
  const payload = {
    character: state.currentCharacter,
    theme: state.theme ? state.theme.name : null,
    equipped: state.equipped,
    timestamp: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `outfit_${(new Date()).toISOString().replace(/[:.]/g,'-')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ========== Small UI helpers ========== */
let toastTimeout = null;
function showToast(text, ms=2500){
  let el = document.getElementById('toastEl');
  if(!el){
    el = document.createElement('div'); el.id='toastEl';
    Object.assign(el.style,{position:'fixed',left:'50%',transform:'translateX(-50%)',bottom:'22px',padding:'10px 14px',background:'#061827',border:'1px solid rgba(255,255,255,0.04)',borderRadius:'12px',zIndex:9999});
    document.body.appendChild(el);
  }
  el.innerText = text;
  el.style.opacity = '1';
  if(toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>{ el.style.opacity='0'; }, ms);
}

/* ========== Small helpers ========== */
function groupBy(arr, key){
  return arr.reduce((acc,x)=>{ (acc[x[key]] = acc[x[key]]||[]).push(x); return acc; }, {});
}
function randomChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }
function lighten(hex, amt){
  // hex like #rrggbb; amt from -1..1
  const c = hex.replace('#','');
  const num = parseInt(c,16);
  let r = (num>>16) + Math.round(amt*255);
  let g = ((num>>8)&0x00FF) + Math.round(amt*255);
  let b = (num&0x0000FF) + Math.round(amt*255);
  r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}

/* ========== Startup ========== */
init();

</script>
